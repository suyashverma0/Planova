[project]
name = "planova-ml"
version = "0.1.0"
description = "Planova Goal Completion Machine Learning & Pipeline Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4.1,<1.5.0",
    "xgboost>=2.0.3,<2.1.0",
    "lightgbm>=4.3.0,<4.4.0",
    "shap>=0.45.0,<0.46.0",
    "mlflow>=2.11.3,<3.0.0",
    "dvc>=3.48.0,<4.0.0",
    "pandas>=2.2.1,<3.0.0",
    "numpy>=1.26.4,<2.0.0",
    "matplotlib>=3.8.3,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "jupyterlab>=4.1.5,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ruff>=0.3.3,<0.4.0",
    "mypy>=1.9.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
