[project]
name = "planova-backend"
version = "0.1.0"
description = "Planova Adaptive Planning SaaS Backend Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<0.112.0",
    "uvicorn[standard]>=0.28.0,<0.30.0",
    "pydantic>=2.6.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "asyncpg>=0.29.0,<0.30.0",
    "alembic>=1.13.1,<2.0.0",
    "redis>=5.0.3,<6.0.0",
    "celery>=5.3.6,<6.0.0",
    "ortools>=9.9.3963,<10.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "httpx>=0.27.0,<0.28.0",
    "python-multipart>=0.0.9,<0.1.0",
    "prometheus-client>=0.20.0,<0.21.0",
    "pyyaml>=6.0.1,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.6,<0.24.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ruff>=0.3.3,<0.4.0",
    "mypy>=1.9.0,<2.0.0",
    "types-pyyaml>=6.0.12,<7.0.0",
    "types-redis>=4.6.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app"
testpaths = ["tests"]
asyncio_mode = "auto"
